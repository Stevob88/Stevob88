<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Site Progress</title>

<!-- PWA / iOS home-screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Site Progress" />
<meta name="theme-color" content="#EAF7F3" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="manifest" href="manifest.json" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- PDF.js — renders the attached site layout plan -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --bg:#EAF7F3;
    --card:#FFFFFF;
    --ink:#1E3A3A;
    --ink-soft:#5B7373;
    --line:#DCEDE8;
    --blue:#5EC6D8;
    --blue-dark:#3AA8BC;
    --green:#33A87D;
    --green-light:#3FB88C;
    --green-soft:#E4F5EE;
    --blue-soft:#E2F5F9;
    --amber:#E8A83A;
    --danger:#E77B7B;
    --shadow:0 2px 10px rgba(30,58,58,.06);
    --radius:16px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:16px;
    line-height:1.4;
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{font-family:'Archivo',sans-serif;margin:0;}

  /* ---------- Sticky top header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:10px;background:var(--blue);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand .mark svg{width:20px;height:20px;}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.3px;}
  .overall-row{display:flex;align-items:center;gap:12px;}
  .overall-bar-wrap{flex:1;}
  .overall-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .overall-meta .pct{color:var(--green);font-weight:700;}
  .bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;}
  .bar > span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green-light));transition:width .3s ease;}

  /* ---------- Main scroll area ---------- */
  main{padding:14px 14px 120px;}

  /* ---------- Stage card ---------- */
  .stage{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:14px;
    overflow:hidden;
  }
  .stage-head{
    display:flex;align-items:center;gap:10px;
    padding:14px;
    cursor:pointer;
  }
  .chev{
    width:22px;height:22px;flex-shrink:0;color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .open > .stage-head .chev, .open > .plot-head .chev{transform:rotate(90deg);}
  .stage-title{flex:1;min-width:0;}
  .stage-name{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;
    color:var(--ink);border:none;background:transparent;width:100%;
    padding:2px 0;letter-spacing:-.2px;
  }
  .stage-name:focus{outline:none;background:var(--blue-soft);border-radius:6px;padding:2px 6px;}
  .chip{
    font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;
    background:var(--blue-soft);color:var(--blue-dark);flex-shrink:0;white-space:nowrap;
  }
  .chip.done{background:var(--green-soft);color:var(--green);}
  .stage-progress{padding:0 14px 12px;}
  .stage-progress .bar{height:6px;}

  /* ---------- Stage body ---------- */
  .stage-body{display:none;padding:0 12px 12px;}
  .open > .stage-body{display:block;}

  /* ---------- Plot ---------- */
  .plot{
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:10px;
    background:#FCFEFD;
    overflow:hidden;
  }
  .plot:last-child{margin-bottom:0;}
  .plot-swipe{position:relative;overflow:hidden;}
  .plot-swipe-action{
    position:absolute;top:0;right:0;bottom:0;left:0;
    display:flex;align-items:center;justify-content:flex-end;gap:8px;
    padding:0 18px;
    background:linear-gradient(90deg,var(--green-light),var(--green));
    color:#fff;font-weight:700;font-size:14px;white-space:nowrap;
  }
  .plot-swipe-action .lbl{overflow:hidden;text-overflow:ellipsis;max-width:60%;}
  .plot-swipe-action svg{width:20px;height:20px;flex-shrink:0;}
  .plot-head{
    position:relative;background:#FCFEFD;
    display:flex;align-items:center;gap:8px;
    padding:11px 12px;cursor:pointer;
    touch-action:pan-y;will-change:transform;
  }
  .plot-head .chev{width:18px;height:18px;}
  .plot-name{
    flex:1;min-width:0;font-weight:700;font-size:15.5px;color:var(--ink);
    border:none;background:transparent;padding:2px 0;
  }
  .plot-name:focus{outline:none;background:var(--blue-soft);border-radius:6px;padding:2px 6px;}
  .frac{
    font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:var(--blue-soft);color:var(--blue-dark);flex-shrink:0;
  }
  .frac.done{background:var(--green-soft);color:var(--green);}
  .plot-body{display:none;padding:2px 10px 10px;}
  .plot.open > .plot-body{display:block;}

  /* ---------- Task ---------- */
  .task{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 4px;border-top:1px solid var(--line);
  }
  .task:first-child{border-top:none;}
  .tick{
    width:30px;height:30px;flex-shrink:0;border-radius:9px;
    border:2px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;margin-top:1px;transition:all .15s ease;
  }
  .tick svg{width:18px;height:18px;color:#fff;opacity:0;transform:scale(.5);transition:all .15s ease;}
  .tick.on{background:var(--green);border-color:var(--green);}
  .tick.on svg{opacity:1;transform:scale(1);}
  .task-main{flex:1;min-width:0;}
  .task-name{
    width:100%;border:none;background:transparent;font-size:15.5px;color:var(--ink);
    padding:5px 0;line-height:1.35;
  }
  .task-name:focus{outline:none;background:var(--blue-soft);border-radius:6px;padding:5px 6px;}
  .task.checked .task-name{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--green-light);}

  /* ---------- Time bar between phases ---------- */
  .time-bar{
    display:flex;align-items:center;gap:6px;
    margin:0 0 0 40px;padding:3px 0 3px 10px;
    border-left:2px dashed var(--blue);
    color:var(--blue-dark);font-size:12.5px;font-weight:700;
  }
  .time-bar svg{width:14px;height:14px;}

  /* ---------- Summary sections (Completed / Logs) ---------- */
  .summary .summary-title{display:flex;align-items:center;gap:9px;}
  .summary-ico{display:flex;flex-shrink:0;}
  .summary-ico svg{width:22px;height:22px;}
  .completed-summary .summary-ico{color:var(--green);}
  .logs-summary .summary-ico{color:var(--blue-dark);}
  .summary-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.2px;}
  .completed-summary{border-color:#CDEFE0;}
  .logs-summary{border-color:#D3ECF2;}
  .empty-note{padding:14px 10px;color:var(--ink-soft);font-size:14px;line-height:1.5;}
  .sum-row{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:12px;background:#FCFEFD;
    padding:11px 12px;margin-bottom:10px;
  }
  .sum-row:last-child{margin-bottom:0;}
  .sum-info{flex:1;min-width:0;}
  .sum-name{font-weight:700;font-size:15.5px;color:var(--ink);}
  .sum-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .sum-restore{
    flex-shrink:0;display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);border-radius:9px;background:#fff;
    color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:600;
    padding:7px 10px;cursor:pointer;
  }
  .sum-restore svg{width:15px;height:15px;}
  .log-body .log-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 4px;border-top:1px solid var(--line);
  }
  .log-body .log-row:first-child{border-top:none;}
  .log-task{flex:1;min-width:0;display:flex;flex-direction:column;}
  .log-name{font-size:15px;font-weight:600;color:var(--ink);}
  .log-stage{font-size:12px;color:var(--ink-soft);}
  .log-dur{
    flex-shrink:0;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:var(--blue-soft);color:var(--blue-dark);
  }

  .note-area{display:none;margin-top:6px;}
  .note-area.show{display:block;}
  .note-area textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fff;resize:vertical;min-height:44px;
  }
  .note-area textarea:focus{outline:none;border-color:var(--blue);}
  .icon-btn{
    width:33px;height:33px;flex-shrink:0;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn.note-on{background:var(--amber);border-color:var(--amber);color:#fff;}
  .icon-btn.del{color:var(--danger);}
  .icon-btn.del svg{width:16px;height:16px;}

  /* ---------- Add buttons ---------- */
  .add-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;padding:10px;margin-top:8px;
    border:1.5px dashed var(--blue);border-radius:11px;background:transparent;
    color:var(--blue-dark);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
  }
  .add-btn svg{width:16px;height:16px;}
  .add-task-btn{margin-top:6px;border-color:var(--line);color:var(--ink-soft);}

  .stage-tools{display:flex;gap:8px;margin-top:4px;}
  .stage-tools .add-btn{margin-top:0;flex:1;}
  .build-tag{text-align:center;color:var(--ink-soft);font-size:11px;opacity:.65;padding:10px 0 2px;}

  .plot-del-row{display:flex;justify-content:flex-end;margin-top:2px;}
  .del-plot{
    display:inline-flex;align-items:center;gap:5px;
    border:none;background:transparent;color:var(--danger);
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 4px;
  }
  .del-plot svg{width:14px;height:14px;}

  #add-stage-btn{margin-top:2px;border-style:solid;background:var(--card);box-shadow:var(--shadow);padding:14px;}

  /* ---------- Sticky export ---------- */
  .export-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(180deg,rgba(234,247,243,0) 0%,var(--bg) 32%);
    pointer-events:none;
  }
  #export-btn{
    pointer-events:auto;
    width:100%;padding:16px;border:none;border-radius:14px;
    background:var(--blue);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:17px;
    display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
    box-shadow:0 6px 18px rgba(94,198,216,.4);letter-spacing:.2px;
  }
  #export-btn:active{background:var(--blue-dark);}
  #export-btn svg{width:20px;height:20px;}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:all .3s ease;z-index:70;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Due dates ---------- */
  .task-actions{display:flex;gap:6px;flex-shrink:0;align-items:flex-start;}
  .due-btn{position:relative;overflow:hidden;}
  .due-btn input[type="date"]{
    position:absolute;inset:0;width:100%;height:100%;
    opacity:0;border:none;padding:0;margin:0;cursor:pointer;
  }
  .icon-btn.due-set{background:var(--blue);border-color:var(--blue);color:#fff;}
  .icon-btn.due-today{background:var(--amber);border-color:var(--amber);color:#fff;}
  .icon-btn.due-over{background:var(--danger);border-color:var(--danger);color:#fff;}
  .due-chip{
    display:inline-flex;align-items:center;gap:6px;margin-top:5px;
    font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;
    background:var(--blue-soft);color:var(--blue-dark);white-space:nowrap;
  }
  .due-chip.today{background:#FDF0D9;color:#A9761A;}
  .due-chip.over{background:#FBE4E4;color:#C25353;}
  .due-chip.met{background:var(--green-soft);color:var(--green);}
  .due-chip.late{background:#FBE4E4;color:#C25353;}
  .due-chip button{
    border:none;background:transparent;color:inherit;font:inherit;
    padding:0 0 0 2px;cursor:pointer;opacity:.7;font-size:14px;line-height:1;
  }
  .due-summary{border-color:#CFE6EE;}
  .due-summary .summary-ico{color:var(--blue-dark);}
  .due-summary .chip.alert{background:#FBE4E4;color:#C25353;}
  .due-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 4px;border-top:1px solid var(--line);
  }
  .due-row:first-child{border-top:none;}
  .due-row .due-info{flex:1;min-width:0;}
  .due-row .due-task{font-size:15px;font-weight:600;color:var(--ink);}
  .due-row .due-where{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  /* ---------- Site plan button + viewer ---------- */
  #plan-btn{
    margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);border-radius:10px;background:#fff;
    color:var(--blue-dark);font-family:inherit;font-size:13px;font-weight:700;
    padding:8px 11px;cursor:pointer;
  }
  #plan-btn svg{width:16px;height:16px;}
  .plan-overlay{
    position:fixed;inset:0;z-index:100;background:#F4FAF8;
    display:flex;flex-direction:column;
  }
  .plan-overlay[hidden]{display:none;}
  .plan-bar{
    display:flex;align-items:center;gap:10px;flex-shrink:0;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background:#fff;border-bottom:1px solid var(--line);
  }
  .plan-bar button{
    border:1px solid var(--line);background:#fff;border-radius:10px;
    color:var(--ink);width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .plan-bar button svg{width:19px;height:19px;}
  .plan-title{
    flex:1;min-width:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .plan-pages{display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .plan-pages[hidden]{display:none;}
  .plan-pages button{width:34px;height:34px;font-size:20px;line-height:1;color:var(--ink-soft);}
  .plan-stage{flex:1;position:relative;overflow:hidden;touch-action:none;}
  .plan-canvas-wrap{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
  .plan-canvas-wrap canvas{display:block;background:#fff;box-shadow:0 2px 12px rgba(30,58,58,.14);}
  .plan-empty{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px 26px;color:var(--ink-soft);gap:4px;
  }
  .plan-empty[hidden]{display:none;}
  .plan-empty svg{width:56px;height:56px;color:var(--blue);opacity:.8;margin-bottom:10px;}
  .plan-empty h3{font-size:18px;color:var(--ink);}
  .plan-empty p{font-size:14.5px;line-height:1.5;max-width:320px;margin:4px 0 16px;}
  .plan-attach{
    border:none;border-radius:12px;background:var(--blue);color:#fff;
    font-family:'Archivo',sans-serif;font-weight:700;font-size:15.5px;
    padding:14px 22px;cursor:pointer;box-shadow:0 4px 14px rgba(94,198,216,.4);
  }
  .plan-loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-weight:600;font-size:15px;
  }
  .plan-loading[hidden]{display:none;}
  .plan-zoom{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 16px);
    display:flex;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:99px;padding:5px;box-shadow:0 4px 16px rgba(30,58,58,.14);
  }
  .plan-zoom button{
    border:none;background:transparent;color:var(--ink);
    font-family:inherit;font-size:17px;font-weight:700;
    min-width:52px;height:40px;border-radius:99px;cursor:pointer;
  }
  .plan-zoom button:active{background:var(--blue-soft);}
  #plan-fit{font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
    </div>
    <h1>Site Progress</h1>
    <button id="plan-btn" aria-label="Site layout plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
      Plan
    </button>
  </div>
  <div class="overall-row">
    <div class="overall-bar-wrap">
      <div class="overall-meta">
        <span id="overall-label">0 of 0 tasks complete</span>
        <span class="pct" id="overall-pct">0%</span>
      </div>
      <div class="bar"><span id="overall-fill" style="width:0%"></span></div>
    </div>
  </div>
</header>

<main id="app"></main>

<div class="export-bar">
  <button id="export-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
    Export as PDF
  </button>
</div>

<div class="toast" id="toast"></div>

<!-- Site plan viewer -->
<div class="plan-overlay" id="plan-overlay" hidden>
  <div class="plan-bar">
    <button class="plan-close" id="plan-close" aria-label="Close plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span class="plan-title" id="plan-title">Site plan</span>
    <div class="plan-pages" id="plan-pages" hidden>
      <button id="plan-prev" aria-label="Previous page">‹</button>
      <span id="plan-pageno">1/1</span>
      <button id="plan-next" aria-label="Next page">›</button>
    </div>
    <button class="plan-menu" id="plan-replace" aria-label="Replace or remove plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
  </div>

  <div class="plan-stage" id="plan-stage">
    <div class="plan-canvas-wrap" id="plan-wrap"><canvas id="plan-canvas"></canvas></div>
    <div class="plan-empty" id="plan-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
      <h3>No site plan attached</h3>
      <p>Attach the site layout plan PDF once and it stays on this phone — open it any time to check plot numbers.</p>
      <button class="plan-attach" id="plan-attach">Attach site plan PDF</button>
    </div>
    <div class="plan-loading" id="plan-loading" hidden>Loading plan…</div>
  </div>

  <div class="plan-zoom">
    <button id="plan-out" aria-label="Zoom out">−</button>
    <button id="plan-fit" aria-label="Fit to screen">Fit</button>
    <button id="plan-in" aria-label="Zoom in">+</button>
  </div>
</div>
<input type="file" id="plan-file" accept="application/pdf,.pdf" hidden />

<script>
"use strict";

/* Build tag — shown at the bottom of the app so you can confirm you're on the latest version */
const BUILD = "build 13 · 12 Aug";

/* ============================================================
   Icons (inline SVG strings)
   ============================================================ */
const ICON = {
  chev:  '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
  note:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 10h16"/><path d="M4 15h9"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/></svg>',
  plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  medal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 6 4-6"/><circle cx="12" cy="15" r="6"/><path d="M12 13v4M10 15h4"/></svg>',
  undo:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h10a4 4 0 010 8h-3"/></svg>',
  cal:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
};

/* ============================================================
   Default seed data
   ============================================================ */
/* Each stage carries a "preset" — the trade tasks auto-added to any plot that is
   created in, or moved into, that stage. */
const SEED = [
  ["Foundations",        ["Groundworker","Steel","NHBC Foundations","Concrete"]],
  ["Substructure",       ["Blockwork","drainage","NHBC Drainage","Block and Beam","Insulation","Pour Slab","Soleplate","Splash","Scaff Matt"]],
  ["Superstructure",     ["Scaffold","Crane","Timberframe","Oregon Externals","Brickwork","NHBC Superstructure"]],
  ["Roof",               ["Felt & Batten","Pv Panel","Roof tile"]],
  ["1st Fix",            ["Joiner Prefix","Electrician Prefix","Plumber Prefix","VCL","Joiner 1st Fix","Plumber 1st Fix","Electrician 1st Fix","Party Wall","Windows","Joiner Dropbacks","Barratt","NHBC Preplaster"]],
  ["Plasterboard",       ["Boarder","Taper","MF Ceiling"]],
  ["2nd Fix",            ["Mistcoat","Joiner 2nd fix","Plumber 2nd fix","Electrician 2nd fix","wall tiler","Kitchen","Patcher"]],
  ["Paint & Decoration", ["Painter"]],
  ["Finals",             ["Build clean","Mastic","Joiner Final","Electrician Final","PV Commission","Plumber final","Flooring","Patcher final","Paint final","Appliances","Reclean","All Trade Snags","CML"]],
];

/* Presets keyed by stage name, plus renames of earlier default names.
   Used to non-destructively backfill presets onto existing saved data. */
const PRESETS = Object.fromEntries(SEED.map(([n, t]) => [n, t]));
const STAGE_RENAMES = { "Paint": "Paint & Decoration" };

const STORE_KEY = "siteProgress.v2";
let uidCounter = 0;
const uid = () => "id" + (Date.now().toString(36)) + (uidCounter++).toString(36) + Math.floor(performance.now()).toString(36);

function buildSeed(){
  return SEED.map(([name, preset]) => ({
    id: uid(),
    name,
    open: false,
    preset: preset.slice(),
    plots: [1,2].map(n => ({
      id: uid(),
      name: "Plot " + n,
      open: false,
      tasks: preset.map(t => ({ id: uid(), name: t, done: false, doneAt: null, due: null, note: "", noteOpen: false }))
    }))
  }));
}

/* Build a fresh task list for a plot from a stage's preset.
   Falls back to a sibling plot's task names if the stage has no preset yet. */
function tasksFromStage(stage){
  let names = (stage.preset && stage.preset.length) ? stage.preset.slice() : [];
  if(!names.length && stage.plots[0]) names = stage.plots[0].tasks.map(t => t.name);
  return names.map(n => ({ id: uid(), name: n, done: false, doneAt: null, due: null, note: "", noteOpen: false }));
}

/* ============================================================
   State + persistence
   ============================================================ */
const TIMELINE_KEY = "siteProgress.timeline.v1";   /* { plotName: [ {stage, task, at} ] } */
const COMPLETED_KEY = "siteProgress.completed.v1"; /* [ { name, at, plot } ] */
const RESTORE_FLAG = "siteProgress.restoredMissing.v1";

let state = load();
let timeline = loadJSON(TIMELINE_KEY, {});
let completed = loadJSON(COMPLETED_KEY, []);
let completedOpen = false, logsOpen = false, dueOpen = false;
const logsExpanded = new Set();

function loadJSON(key, dflt){
  try{ const r = localStorage.getItem(key); if(r) return JSON.parse(r); }catch(e){ console.warn("load failed", key, e); }
  return dflt;
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length >= 0) return restoreMissingStages(migrate(normalize(parsed)));
    }
  }catch(e){ console.warn("load failed", e); }
  try{ localStorage.setItem(RESTORE_FLAG, "1"); }catch(e){}   /* fresh install already has every stage */
  return buildSeed();
}

/* One-time repair: re-insert any DEFAULT stage that has gone missing (e.g. deleted by
   accident), at its correct position, with its preset and sample plots. Runs once only,
   so intentionally deleted stages don't keep coming back. */
function restoreMissingStages(stages){
  try{ if(localStorage.getItem(RESTORE_FLAG)) return stages; }catch(e){}
  const key = s => (s || "").trim().toLowerCase();
  let changed = false;
  SEED.forEach(([name, preset], i) => {
    if(stages.some(s => key(s.name) === key(name))) return;
    const fresh = {
      id: uid(), name, open: false, preset: preset.slice(),
      plots: [1, 2].map(n => ({
        id: uid(), name: "Plot " + n, open: false,
        tasks: preset.map(t => ({ id: uid(), name: t, done: false, doneAt: null, due: null, note: "", noteOpen: false }))
      }))
    };
    let insertAt = 0;
    for(let j = i - 1; j >= 0; j--){
      const idx = stages.findIndex(s => key(s.name) === key(SEED[j][0]));
      if(idx >= 0){ insertAt = idx + 1; break; }
    }
    stages.splice(insertAt, 0, fresh);
    changed = true;
  });
  try{
    if(changed) localStorage.setItem(STORE_KEY, JSON.stringify(stages));
    localStorage.setItem(RESTORE_FLAG, "1");
  }catch(e){}
  return stages;
}

/* Non-destructively bring saved data up to date with the latest preset library:
   apply known stage renames and backfill presets (and empty plots) for any stage
   that still has no preset. Existing names, ticks and populated plots are untouched. */
function migrate(stages){
  stages.forEach(s => {
    if(STAGE_RENAMES[s.name] && (!s.preset || !s.preset.length)) s.name = STAGE_RENAMES[s.name];
  });
  stages.forEach(s => {
    if((!s.preset || !s.preset.length) && PRESETS[s.name]){
      s.preset = PRESETS[s.name].slice();
      s.plots.forEach(p => {
        if(!p.tasks || !p.tasks.length){
          p.tasks = s.preset.map(n => ({ id: uid(), name: n, done: false, doneAt: null, due: null, note: "", noteOpen: false }));
        }
      });
    }
  });
  return stages;
}

/* Make sure every node has the fields we expect (defensive against old saves) */
function normalize(stages){
  return stages.map(s => ({
    id: s.id || uid(),
    name: s.name || "Stage",
    open: !!s.open,
    preset: Array.isArray(s.preset) ? s.preset.slice() : [],
    plots: (s.plots || []).map(p => ({
      id: p.id || uid(),
      name: p.name || "Plot",
      open: !!p.open,
      tasks: (p.tasks || []).map(t => ({
        id: t.id || uid(),
        name: t.name || "",
        done: !!t.done,
        doneAt: (typeof t.doneAt === "number") ? t.doneAt : null,
        due: t.due || null,
        note: t.note || "",
        noteOpen: !!t.noteOpen
      }))
    }))
  }));
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 120);
}
function saveNow(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    localStorage.setItem(TIMELINE_KEY, JSON.stringify(timeline));
    localStorage.setItem(COMPLETED_KEY, JSON.stringify(completed));
  }catch(e){ console.warn("save failed", e); }
}

/* ============================================================
   Timeline + completion helpers
   ============================================================ */
function nowMs(){ return Date.now(); }

function logEvent(plotName, stageName, taskName, at){
  if(!timeline[plotName]) timeline[plotName] = [];
  timeline[plotName].push({ stage: stageName, task: taskName, at });
}
function unlogEvent(plotName, stageName, taskName){
  const arr = timeline[plotName];
  if(!arr) return;
  for(let i = arr.length - 1; i >= 0; i--){
    if(arr[i].stage === stageName && arr[i].task === taskName){ arr.splice(i, 1); break; }
  }
}
function isCML(name){ return (name || "").trim().toLowerCase() === "cml"; }

function completePlot(stage, plot){
  completed.push({ name: plot.name, at: nowMs(), plot: JSON.parse(JSON.stringify(plot)) });
  stage.plots = stage.plots.filter(p => p.id !== plot.id);
}
function restorePlot(name){
  const idx = completed.findIndex(c => c.name === name);
  if(idx < 0) return;
  const entry = completed.splice(idx, 1)[0];
  const finals = state[state.length - 1];
  const p = entry.plot || { id: uid(), name, open: false, tasks: tasksFromStage(finals) };
  p.id = uid(); p.open = false;
  (p.tasks || []).forEach(t => { if(isCML(t.name)){ t.done = false; t.doneAt = null; } });
  unlogEvent(name, finals.name, "CML");
  finals.plots.push(p);
  finals.open = true;
}

/* ============================================================
   Due dates — what a trade promised when you asked them on site
   ============================================================ */
function dateStr(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayStr(){ return dateStr(new Date()); }

/* null = no date | "soon" | "today" | "over" | "met" | "late" */
function dueState(task){
  if(!task.due) return null;
  if(task.done){
    const on = task.doneAt ? dateStr(new Date(task.doneAt)) : null;
    return (on && on > task.due) ? "late" : "met";
  }
  const t = todayStr();
  if(task.due < t) return "over";
  if(task.due === t) return "today";
  return "soon";
}
function daysBetween(a, b){  /* whole days between two YYYY-MM-DD strings */
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}
function fmtDay(s){
  try{
    const d = new Date(s + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }catch(e){ return s; }
}
function dueLabel(task){
  const st = dueState(task);
  if(st === "today") return "Due today";
  if(st === "over"){
    const n = daysBetween(task.due, todayStr());
    return n === 1 ? "1 day over" : n + " days over";
  }
  if(st === "met") return "On time";
  if(st === "late"){
    const on = dateStr(new Date(task.doneAt));
    const n = daysBetween(task.due, on);
    return n === 1 ? "1 day late" : n + " days late";
  }
  return "Due " + fmtDay(task.due);
}
function dueChip(task){
  const st = dueState(task);
  const chip = document.createElement("span");
  chip.className = "due-chip" + (st && st !== "soon" ? " " + st : "");
  const txt = document.createElement("span");
  txt.textContent = dueLabel(task) + (st === "today" || st === "over" ? "" : st === "met" || st === "late" ? "  ·  " + fmtDay(task.due) : "");
  chip.appendChild(txt);
  const clear = document.createElement("button");
  clear.textContent = "×";
  clear.setAttribute("aria-label", "Clear date");
  clear.onclick = e => { e.stopPropagation(); task.due = null; saveNow(); render(); };
  chip.appendChild(clear);
  return chip;
}

/* Every outstanding promise across the whole site, soonest first */
function outstandingDue(){
  const out = [];
  state.forEach(stage => stage.plots.forEach(plot => plot.tasks.forEach(task => {
    if(task.due && !task.done) out.push({ stage, plot, task });
  })));
  out.sort((a, b) => a.task.due < b.task.due ? -1 : a.task.due > b.task.due ? 1 : 0);
  return out;
}

function renderDueSection(){
  const rows = outstandingDue();
  const overdue = rows.filter(r => dueState(r.task) === "over").length;
  const el = document.createElement("div");
  el.className = "stage summary due-summary" + (dueOpen ? " open" : "");
  const head = summaryHead("Due Dates", ICON.cal, rows.length, dueOpen,
    () => { dueOpen = !dueOpen; save(); el.classList.toggle("open", dueOpen); });
  if(overdue){
    const chip = head.querySelector(".chip");
    chip.classList.add("alert");
    chip.textContent = rows.length + " · " + overdue + " over";
  }
  el.appendChild(head);

  const body = document.createElement("div");
  body.className = "stage-body";
  if(!rows.length){
    body.appendChild(emptyNote("No dates set. When a trade tells you they'll be finished, tap the calendar on that task and it shows up here."));
  } else {
    rows.forEach(({ stage, plot, task }) => {
      const row = document.createElement("div");
      row.className = "due-row";
      const info = document.createElement("div");
      info.className = "due-info";
      const t = document.createElement("div");
      t.className = "due-task";
      t.textContent = task.name || "(unnamed task)";
      const w = document.createElement("div");
      w.className = "due-where";
      w.textContent = plot.name + "  ·  " + stage.name;
      info.appendChild(t); info.appendChild(w);
      row.appendChild(info);
      row.appendChild(dueChip(task));
      body.appendChild(row);
    });
  }
  el.appendChild(body);
  return el;
}

/* Human-friendly duration, tuned for site work (days, then hours, then minutes) */
function fmtDur(ms){
  if(ms == null) return "";
  if(ms < 0) ms = 0;
  const d = ms / 86400000;
  if(d >= 1) return (Math.round(d * 10) / 10).toString().replace(/\.0$/, "") + "d";
  const h = ms / 3600000;
  if(h >= 1) return Math.round(h) + "h";
  return Math.max(1, Math.round(ms / 60000)) + "m";
}

/* ============================================================
   Progress maths
   ============================================================ */
function stageCounts(stage){
  let done = 0, total = 0;
  stage.plots.forEach(p => p.tasks.forEach(t => { total++; if(t.done) done++; }));
  return { done, total };
}
function plotCounts(plot){
  let done = 0;
  plot.tasks.forEach(t => { if(t.done) done++; });
  return { done, total: plot.tasks.length };
}
function overallCounts(){
  let done = 0, total = 0;
  state.forEach(s => { const c = stageCounts(s); done += c.done; total += c.total; });
  return { done, total };
}
const pct = (done, total) => total === 0 ? 0 : Math.round((done/total)*100);

/* ============================================================
   Render
   ============================================================ */
const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  app.appendChild(renderDueSection());
  state.forEach(stage => app.appendChild(renderStage(stage)));

  const addStage = document.createElement("button");
  addStage.className = "add-btn";
  addStage.id = "add-stage-btn";
  addStage.innerHTML = ICON.plus + " Add stage";
  addStage.onclick = () => {
    state.push({ id: uid(), name: "New stage", open: true, preset: [], plots: [] });
    save(); render();
  };
  app.appendChild(addStage);

  app.appendChild(renderCompletedSection());
  app.appendChild(renderLogsSection());

  const tag = document.createElement("div");
  tag.className = "build-tag";
  tag.textContent = "Site Progress · " + BUILD;
  app.appendChild(tag);

  renderOverall();
}

/* Small "time bar" shown between two completed phases */
function timeBar(label){
  const el = document.createElement("div");
  el.className = "time-bar";
  el.innerHTML = ICON.clock + "<span>" + label + "</span>";
  return el;
}

/* Ordered completion events for a plot name (across every stage it has passed through) */
function plotEvents(name){
  return (timeline[name] || []).slice().sort((a, b) => a.at - b.at);
}
function plotTotal(name){
  const ev = plotEvents(name);
  return ev.length >= 2 ? ev[ev.length - 1].at - ev[0].at : 0;
}

function summaryHead(titleText, iconSvg, count, open, onToggle){
  const head = document.createElement("div");
  head.className = "stage-head";
  head.innerHTML = ICON.chev;
  const title = document.createElement("div");
  title.className = "stage-title summary-title";
  title.innerHTML = '<span class="summary-ico">' + iconSvg + "</span>";
  const h = document.createElement("span");
  h.className = "summary-name";
  h.textContent = titleText;
  title.appendChild(h);
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.textContent = count;
  head.appendChild(title);
  head.appendChild(chip);
  head.onclick = onToggle;
  return head;
}

function renderCompletedSection(){
  const el = document.createElement("div");
  el.className = "stage summary completed-summary" + (completedOpen ? " open" : "");
  el.appendChild(summaryHead("Completed Plots", ICON.medal, completed.length, completedOpen,
    () => { completedOpen = !completedOpen; save(); el.classList.toggle("open", completedOpen); }));

  const body = document.createElement("div");
  body.className = "stage-body";
  if(!completed.length){
    body.appendChild(emptyNote("No completed plots yet. Tick a plot's “CML” task and it lands here."));
  } else {
    completed.slice().sort((a, b) => b.at - a.at).forEach(c => {
      const row = document.createElement("div");
      row.className = "sum-row";
      const info = document.createElement("div");
      info.className = "sum-info";
      const nm = document.createElement("div");
      nm.className = "sum-name";
      nm.textContent = c.name;
      const meta = document.createElement("div");
      meta.className = "sum-meta";
      const total = plotTotal(c.name);
      meta.textContent = "Completed " + fmtDate(c.at) + (total > 0 ? "  ·  build time " + fmtDur(total) : "");
      info.appendChild(nm); info.appendChild(meta);
      const restore = document.createElement("button");
      restore.className = "sum-restore";
      restore.innerHTML = ICON.undo + " Restore";
      restore.setAttribute("aria-label", "Restore plot to Finals");
      restore.onclick = () => {
        if(confirm('Move "' + c.name + '" back into Finals?')){ restorePlot(c.name); saveNow(); render(); }
      };
      row.appendChild(info); row.appendChild(restore);
      body.appendChild(row);
    });
  }
  el.appendChild(body);
  return el;
}

function renderLogsSection(){
  const names = Object.keys(timeline).filter(n => (timeline[n] || []).length);
  const el = document.createElement("div");
  el.className = "stage summary logs-summary" + (logsOpen ? " open" : "");
  el.appendChild(summaryHead("Plot Time Scale Logs", ICON.clock, names.length, logsOpen,
    () => { logsOpen = !logsOpen; save(); el.classList.toggle("open", logsOpen); }));

  const body = document.createElement("div");
  body.className = "stage-body";
  if(!names.length){
    body.appendChild(emptyNote("No timings yet. As you tick tasks, each plot's phase durations are logged here."));
  } else {
    names.sort();
    names.forEach(name => {
      const isOpen = logsExpanded.has(name);
      const card = document.createElement("div");
      card.className = "plot" + (isOpen ? " open" : "");

      const head = document.createElement("div");
      head.className = "plot-head";
      head.innerHTML = ICON.chev;
      const nm = document.createElement("span");
      nm.className = "plot-name";
      nm.style.fontWeight = "700";
      nm.textContent = name;
      const total = plotTotal(name);
      const badge = document.createElement("span");
      badge.className = "frac";
      badge.textContent = total > 0 ? fmtDur(total) : (timeline[name].length + "×");
      head.appendChild(nm); head.appendChild(badge);
      head.onclick = () => {
        if(isOpen) logsExpanded.delete(name); else logsExpanded.add(name);
        card.classList.toggle("open");
        /* rebuild body lazily */
        renderLogBody(logBody, name);
      };
      card.appendChild(head);

      const logBody = document.createElement("div");
      logBody.className = "plot-body log-body";
      renderLogBody(logBody, name);
      card.appendChild(logBody);
      body.appendChild(card);
    });
  }
  el.appendChild(body);
  return el;
}

function renderLogBody(container, name){
  container.innerHTML = "";
  const ev = plotEvents(name);
  ev.forEach((e, i) => {
    const row = document.createElement("div");
    row.className = "log-row";
    const left = document.createElement("div");
    left.className = "log-task";
    left.innerHTML = '<span class="log-name"></span><span class="log-stage"></span>';
    left.querySelector(".log-name").textContent = e.task;
    left.querySelector(".log-stage").textContent = e.stage;
    const dur = document.createElement("span");
    dur.className = "log-dur";
    dur.textContent = i === 0 ? "start" : fmtDur(e.at - ev[i - 1].at);
    row.appendChild(left); row.appendChild(dur);
    container.appendChild(row);
  });
}

function emptyNote(text){
  const n = document.createElement("div");
  n.className = "empty-note";
  n.textContent = text;
  return n;
}

function fmtDate(ms){
  try{ return new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  catch(e){ return ""; }
}

function renderOverall(){
  const { done, total } = overallCounts();
  const p = pct(done, total);
  document.getElementById("overall-label").textContent = done + " of " + total + " tasks complete";
  document.getElementById("overall-pct").textContent = p + "%";
  document.getElementById("overall-fill").style.width = p + "%";
}

function renderStage(stage){
  const el = document.createElement("div");
  el.className = "stage" + (stage.open ? " open" : "");
  const { done, total } = stageCounts(stage);
  const p = pct(done, total);

  /* head */
  const head = document.createElement("div");
  head.className = "stage-head";
  head.innerHTML = ICON.chev;

  const title = document.createElement("div");
  title.className = "stage-title";
  const nameInput = document.createElement("input");
  nameInput.className = "stage-name";
  nameInput.value = stage.name;
  nameInput.setAttribute("aria-label","Stage name");
  nameInput.onclick = e => e.stopPropagation();
  nameInput.oninput = () => { stage.name = nameInput.value; save(); };
  title.appendChild(nameInput);

  const chip = document.createElement("span");
  chip.className = "chip" + (total>0 && done===total ? " done" : "");
  chip.textContent = p + "%";

  head.appendChild(title);
  head.appendChild(chip);
  head.onclick = () => { stage.open = !stage.open; save(); el.classList.toggle("open", stage.open); };
  el.appendChild(head);

  /* progress bar */
  const prog = document.createElement("div");
  prog.className = "stage-progress";
  prog.innerHTML = '<div class="bar"><span style="width:'+p+'%"></span></div>';
  el.appendChild(prog);

  /* body */
  const body = document.createElement("div");
  body.className = "stage-body";
  stage.plots.forEach(plot => body.appendChild(renderPlot(stage, plot)));

  const tools = document.createElement("div");
  tools.className = "stage-tools";
  const addPlot = document.createElement("button");
  addPlot.className = "add-btn";
  addPlot.innerHTML = ICON.plus + " Add plot";
  addPlot.onclick = () => {
    plot_new(stage);
    save(); render();
  };
  tools.appendChild(addPlot);
  body.appendChild(tools);

  el.appendChild(body);
  return el;
}

function plot_new(stage){
  const n = stage.plots.length + 1;
  stage.plots.push({ id: uid(), name: "Plot " + n, open: true, tasks: tasksFromStage(stage) });
}

function renderPlot(stage, plot){
  const el = document.createElement("div");
  el.className = "plot" + (plot.open ? " open" : "");
  const { done, total } = plotCounts(plot);

  const si = state.indexOf(stage);
  const nextStage = (si >= 0 && si < state.length - 1) ? state[si + 1] : null;

  const swipe = document.createElement("div");
  swipe.className = "plot-swipe";

  if(nextStage){
    const action = document.createElement("div");
    action.className = "plot-swipe-action";
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = nextStage.name;
    action.appendChild(lbl);
    action.insertAdjacentHTML("beforeend", ICON.arrow);
    swipe.appendChild(action);
  }

  const head = document.createElement("div");
  head.className = "plot-head";
  head.innerHTML = ICON.chev;

  const nameInput = document.createElement("input");
  nameInput.className = "plot-name";
  nameInput.value = plot.name;
  nameInput.setAttribute("aria-label","Plot name");
  nameInput.onclick = e => e.stopPropagation();
  nameInput.oninput = () => { plot.name = nameInput.value; save(); };

  const frac = document.createElement("span");
  frac.className = "frac" + (total>0 && done===total ? " done" : "");
  frac.textContent = done + "/" + total;

  head.appendChild(nameInput);
  head.appendChild(frac);
  head.onclick = () => {
    if(head.__swiped) return;              /* was a horizontal swipe — ignore the tap */
    plot.open = !plot.open; save(); el.classList.toggle("open", plot.open);
  };
  swipe.appendChild(head);
  el.appendChild(swipe);

  if(nextStage) attachSwipe(head, stage, plot);

  const body = document.createElement("div");
  body.className = "plot-body";
  plot.tasks.forEach((task, i) => {
    body.appendChild(renderTask(stage, plot, task));
    /* time bar between two consecutive completed phases */
    const next = plot.tasks[i + 1];
    if(task.done && next && next.done && typeof task.doneAt === "number" && typeof next.doneAt === "number"){
      const gap = next.doneAt - task.doneAt;
      if(gap > 0) body.appendChild(timeBar(fmtDur(gap)));
    }
  });

  const addTask = document.createElement("button");
  addTask.className = "add-btn add-task-btn";
  addTask.innerHTML = ICON.plus + " Add task";
  addTask.onclick = () => {
    plot.tasks.push({ id: uid(), name: "", done:false, doneAt:null, due:null, note:"", noteOpen:true });
    save(); render();
  };
  body.appendChild(addTask);

  const delRow = document.createElement("div");
  delRow.className = "plot-del-row";
  const delPlot = document.createElement("button");
  delPlot.className = "del-plot";
  delPlot.innerHTML = ICON.trash + " Delete plot";
  delPlot.onclick = () => {
    if(confirm('Delete "'+plot.name+'"?')){
      stage.plots = stage.plots.filter(p => p.id !== plot.id);
      save(); render();
    }
  };
  delRow.appendChild(delPlot);
  body.appendChild(delRow);

  el.appendChild(body);
  return el;
}

/* Swipe a plot row left to advance it to the next stage */
function attachSwipe(head, stage, plot){
  const MAX = 150, TRIG = 72;
  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horiz = false;

  const settle = () => {
    head.style.transition = "transform .2s ease";
    head.style.transform = "translateX(0)";
  };

  head.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    dx = 0; dragging = true; decided = false; horiz = false;
    head.style.transition = "none";
  });

  head.addEventListener("pointermove", e => {
    if(!dragging) return;
    const mx = e.clientX - startX, my = e.clientY - startY;
    if(!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)){
      decided = true;
      horiz = Math.abs(mx) > Math.abs(my);
      if(horiz){ try{ head.setPointerCapture(e.pointerId); }catch(_){ } }
    }
    if(decided && horiz){
      dx = Math.max(-MAX, Math.min(0, mx));   /* left only */
      head.style.transform = "translateX(" + dx + "px)";
      if(Math.abs(dx) > 6) head.__swiped = true;
    }
  });

  const end = () => {
    if(!dragging) return;
    dragging = false;
    const trigger = decided && horiz && dx <= -TRIG;
    settle();
    if(trigger) setTimeout(() => movePlotToNextStage(stage, plot), 80);
    setTimeout(() => { head.__swiped = false; }, 60);
  };
  head.addEventListener("pointerup", end);
  head.addEventListener("pointercancel", end);
}

function movePlotToNextStage(stage, plot){
  const si = state.indexOf(stage);
  if(si < 0 || si >= state.length - 1){ showToast('"' + plot.name + '" is at the final stage'); return; }
  const next = state[si + 1];
  const c = plotCounts(plot);
  if(!confirm('Move "' + plot.name + '" (' + c.done + '/' + c.total + ' done) to "' + next.name + '"?')) return;

  /* remove from current stage */
  stage.plots = stage.plots.filter(p => p.id !== plot.id);

  /* merge on matching name so we never create a duplicate plot in the next stage */
  const existing = next.plots.find(p => p.name.trim().toLowerCase() === plot.name.trim().toLowerCase());
  if(!existing){
    /* new to this stage — give it this stage's preset checklist (fresh/unticked) */
    next.plots.push({ id: uid(), name: plot.name, open: false, tasks: tasksFromStage(next) });
  }

  next.open = true;          /* reveal the destination so the move is visible */
  save(); render();
  showToast('"' + plot.name + '" moved to ' + next.name);
}

function renderTask(stage, plot, task){
  const el = document.createElement("div");
  el.className = "task" + (task.done ? " checked" : "");

  /* tick */
  const tick = document.createElement("div");
  tick.className = "tick" + (task.done ? " on" : "");
  tick.innerHTML = ICON.check;
  tick.setAttribute("role","checkbox");
  tick.setAttribute("aria-checked", task.done ? "true" : "false");
  tick.onclick = () => {
    task.done = !task.done;
    if(task.done){
      task.doneAt = nowMs();
      logEvent(plot.name, stage.name, task.name, task.doneAt);
      if(isCML(task.name)){
        completePlot(stage, plot);
        saveNow(); render();
        showToast('"' + plot.name + '" complete → Completed Plots');
        return;
      }
    } else {
      unlogEvent(plot.name, stage.name, task.name);
      task.doneAt = null;
    }
    saveNow(); render();
  };

  /* main */
  const main = document.createElement("div");
  main.className = "task-main";
  const nameInput = document.createElement("input");
  nameInput.className = "task-name";
  nameInput.value = task.name;
  nameInput.placeholder = "Task name";
  nameInput.setAttribute("aria-label","Task name");
  nameInput.oninput = () => { task.name = nameInput.value; save(); };
  main.appendChild(nameInput);

  /* due-date chip (only shown once a date has been set) */
  const dueWrap = document.createElement("div");
  main.appendChild(dueWrap);

  const noteArea = document.createElement("div");
  noteArea.className = "note-area" + (task.noteOpen ? " show" : "");
  const ta = document.createElement("textarea");
  ta.value = task.note;
  ta.placeholder = "Add a note…";
  ta.setAttribute("aria-label","Task note");
  ta.oninput = () => { task.note = ta.value; save(); updateNoteBtn(); };
  noteArea.appendChild(ta);
  main.appendChild(noteArea);

  /* actions */
  const actions = document.createElement("div");
  actions.className = "task-actions";

  const noteBtn = document.createElement("button");
  noteBtn.innerHTML = ICON.note;
  noteBtn.setAttribute("aria-label","Toggle note");
  function updateNoteBtn(){
    const hasNote = task.note.trim().length > 0;
    noteBtn.className = "icon-btn" + (hasNote ? " note-on" : "");
  }
  updateNoteBtn();
  noteBtn.onclick = () => {
    task.noteOpen = !task.noteOpen;
    save();
    noteArea.classList.toggle("show", task.noteOpen);
    if(task.noteOpen) ta.focus();
  };

  /* due date — a native date picker hidden over a calendar button */
  const dueBtn = document.createElement("label");
  dueBtn.innerHTML = ICON.cal;
  dueBtn.setAttribute("aria-label","Set date trade will finish");
  const dueInput = document.createElement("input");
  dueInput.type = "date";
  dueInput.value = task.due || "";
  dueInput.setAttribute("aria-label","Finish date");
  dueInput.onchange = () => {
    task.due = dueInput.value || null;
    saveNow(); render();
  };
  dueBtn.appendChild(dueInput);

  function paintDue(){
    const st = dueState(task);
    dueBtn.className = "icon-btn due-btn" + (st === "over" ? " due-over" : st === "today" ? " due-today" : st ? " due-set" : "");
    dueWrap.innerHTML = "";
    if(task.due) dueWrap.appendChild(dueChip(task));
  }
  paintDue();

  const delBtn = document.createElement("button");
  delBtn.className = "icon-btn del";
  delBtn.innerHTML = ICON.trash;
  delBtn.setAttribute("aria-label","Delete task");
  delBtn.onclick = () => {
    plot.tasks = plot.tasks.filter(t => t.id !== task.id);
    save(); render();
  };

  actions.appendChild(noteBtn);
  actions.appendChild(dueBtn);
  actions.appendChild(delBtn);

  el.appendChild(tick);
  el.appendChild(main);
  el.appendChild(actions);
  return el;
}

/* Refresh all numeric displays (chips, fractions, bars, overall) in place */
function refreshCounts(){
  const stageEls = app.querySelectorAll(".stage");
  stageEls.forEach((sEl, si) => {
    const stage = state[si];
    if(!stage) return;
    const sc = stageCounts(stage);
    const sp = pct(sc.done, sc.total);
    const chip = sEl.querySelector(".stage-head .chip");
    if(chip){ chip.textContent = sp + "%"; chip.classList.toggle("done", sc.total>0 && sc.done===sc.total); }
    const fill = sEl.querySelector(".stage-progress .bar > span");
    if(fill) fill.style.width = sp + "%";
    const plotEls = sEl.querySelectorAll(".stage-body > .plot");
    plotEls.forEach((pEl, pi) => {
      const plot = stage.plots[pi];
      if(!plot) return;
      const pc = plotCounts(plot);
      const frac = pEl.querySelector(".plot-head .frac");
      if(frac){ frac.textContent = pc.done + "/" + pc.total; frac.classList.toggle("done", pc.total>0 && pc.done===pc.total); }
    });
  });
  renderOverall();
}

/* ============================================================
   PDF export
   ============================================================ */
function exportPDF(){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ showToast("PDF library not loaded — check connection"); return; }

  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 40;
  const marginBottom = 46;
  let y = 52;

  const today = new Date();
  const dateStr = today.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
  const fileDate = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
  const { done, total } = overallCounts();
  const overallP = pct(done, total);

  function newPageIfNeeded(need){
    if(y + need > pageH - marginBottom){ doc.addPage(); y = 52; }
  }

  /* Title */
  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.setTextColor(30,58,58);
  doc.text("Site Progress", marginX, y);
  y += 22;

  doc.setFont("helvetica","normal");
  doc.setFontSize(11);
  doc.setTextColor(91,115,115);
  doc.text(dateStr, marginX, y);
  doc.text("Overall: " + overallP + "%  (" + done + "/" + total + " tasks)", pageW - marginX, y, { align:"right" });
  y += 12;
  doc.setDrawColor(220,237,232);
  doc.setLineWidth(1);
  doc.line(marginX, y, pageW - marginX, y);
  y += 22;

  state.forEach(stage => {
    const sc = stageCounts(stage);
    const sp = pct(sc.done, sc.total);

    newPageIfNeeded(30);
    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.setTextColor(58,168,188);
    doc.text(stage.name || "Stage", marginX, y);
    doc.setFont("helvetica","normal");
    doc.setFontSize(10);
    doc.setTextColor(91,115,115);
    doc.text(sp + "%  (" + sc.done + "/" + sc.total + ")", pageW - marginX, y, { align:"right" });
    y += 16;

    if(stage.plots.length === 0){
      doc.setFontSize(10);
      doc.setTextColor(150,165,165);
      doc.text("— no plots —", marginX + 12, y);
      y += 16;
    }

    stage.plots.forEach(plot => {
      const pc = plotCounts(plot);
      newPageIfNeeded(22);
      doc.setFont("helvetica","bold");
      doc.setFontSize(11.5);
      doc.setTextColor(30,58,58);
      doc.text(plot.name || "Plot", marginX + 12, y);
      doc.setFont("helvetica","normal");
      doc.setFontSize(9.5);
      doc.setTextColor(120,140,140);
      doc.text(pc.done + "/" + pc.total, pageW - marginX, y, { align:"right" });
      y += 15;

      if(plot.tasks.length === 0){
        doc.setFontSize(9.5);
        doc.setTextColor(160,175,175);
        doc.text("(no tasks)", marginX + 26, y);
        y += 14;
      }

      plot.tasks.forEach(task => {
        newPageIfNeeded(16);
        const box = task.done ? "[x]" : "[ ]";
        doc.setFont("courier","normal");
        doc.setFontSize(10.5);
        doc.setTextColor(task.done ? 51 : 120, task.done ? 168 : 140, task.done ? 125 : 140);
        doc.text(box, marginX + 26, y);

        doc.setFont("helvetica","normal");
        doc.setFontSize(11);
        doc.setTextColor(30,58,58);
        const nameX = marginX + 52;
        const nameLines = doc.splitTextToSize(task.name || "(unnamed task)", pageW - marginX - nameX);
        doc.text(nameLines, nameX, y);
        y += 14 * nameLines.length;

        if(task.due){
          newPageIfNeeded(13);
          const st = dueState(task);
          doc.setFont("helvetica","normal");
          doc.setFontSize(9.5);
          if(st === "over" || st === "late") doc.setTextColor(194,83,83);
          else if(st === "today") doc.setTextColor(169,118,26);
          else if(st === "met") doc.setTextColor(51,168,125);
          else doc.setTextColor(58,168,188);
          doc.text("Due " + fmtDay(task.due) + "  (" + dueLabel(task) + ")", nameX + 12, y);
          y += 12.5;
        }

        const note = (task.note || "").trim();
        if(note){
          doc.setFont("helvetica","italic");
          doc.setFontSize(9.5);
          doc.setTextColor(120,140,140);
          const noteLines = doc.splitTextToSize("Note: " + note, pageW - marginX - (nameX + 12));
          noteLines.forEach(line => {
            newPageIfNeeded(13);
            doc.text(line, nameX + 12, y);
            y += 12.5;
          });
          y += 2;
        }
      });
      y += 6;
    });
    y += 10;
  });

  doc.save("Site-Progress-" + fileDate + ".pdf");
  showToast("PDF exported");
}

/* ============================================================
   Site layout plan — a PDF kept on this device (IndexedDB, so a
   multi-megabyte drawing is fine) and rendered with PDF.js
   ============================================================ */
const DB_NAME = "siteProgressFiles", DB_STORE = "files", PLAN_KEY = "siteplan";

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbTx(mode, fn){
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, mode);
    const rq = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}
const planSave = rec => idbTx("readwrite", s => s.put(rec, PLAN_KEY));
const planLoad = ()  => idbTx("readonly",  s => s.get(PLAN_KEY));
const planDrop = ()  => idbTx("readwrite", s => s.delete(PLAN_KEY));

const planEls = {};
let planDoc = null, planPage = 1, planScale = 1, planFitScale = 1, planTx = 0, planTy = 0;

function planBind(){
  ["overlay","close","title","pages","prev","next","pageno","replace","stage","wrap","canvas","empty","loading","attach","file","out","fit","in"]
    .forEach(k => planEls[k] = document.getElementById("plan-" + k));

  planEls.overlay && (planEls.close.onclick = closePlan);
  document.getElementById("plan-btn").onclick = openPlan;
  planEls.attach.onclick = () => planEls.file.click();
  planEls.file.onchange = onPlanFile;
  planEls.replace.onclick = planMenu;
  planEls.prev.onclick = () => gotoPlanPage(planPage - 1);
  planEls.next.onclick = () => gotoPlanPage(planPage + 1);
  planEls.in.onclick  = () => zoomPlan(1.4);
  planEls.out.onclick = () => zoomPlan(1 / 1.4);
  planEls.fit.onclick = () => { planScale = planFitScale; centrePlan(); applyPlanTransform(); };
  attachPlanGestures();
}

function openPlan(){
  planEls.overlay.hidden = false;
  document.body.style.overflow = "hidden";
  if(!planDoc) loadPlanFromStore();
}
function closePlan(){
  planEls.overlay.hidden = true;
  document.body.style.overflow = "";
}

function planMenu(){
  if(!planDoc){ planEls.file.click(); return; }
  if(confirm("Replace the site plan with a different PDF?\n\nTap Cancel to keep it, then use Remove below if you want it gone.")){
    planEls.file.click();
  } else if(confirm("Remove the current site plan?")){
    planDrop().then(() => { planDoc = null; showPlanEmpty(); showToast("Site plan removed"); });
  }
}

function onPlanFile(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  if(!/pdf/i.test(f.type) && !/\.pdf$/i.test(f.name)){ showToast("Please choose a PDF"); return; }
  planEls.empty.hidden = true;
  planEls.loading.hidden = false;
  f.arrayBuffer()
    .then(buf => planSave({ name: f.name, buf }).then(() => renderPlanFrom(buf, f.name)))
    .then(() => showToast("Site plan saved to this phone"))
    .catch(err => { console.warn(err); planEls.loading.hidden = true; showToast("Could not save that PDF"); });
}

function loadPlanFromStore(){
  planEls.loading.hidden = false;
  planEls.empty.hidden = true;
  planLoad()
    .then(rec => {
      if(!rec || !rec.buf){ showPlanEmpty(); return; }
      return renderPlanFrom(rec.buf, rec.name);
    })
    .catch(err => { console.warn(err); showPlanEmpty(); });
}

function showPlanEmpty(){
  planEls.loading.hidden = true;
  planEls.empty.hidden = false;
  planEls.pages.hidden = true;
  planEls.title.textContent = "Site plan";
  planEls.canvas.width = planEls.canvas.height = 0;
}

function renderPlanFrom(buf, name){
  const lib = window.pdfjsLib;
  if(!lib){ planEls.loading.hidden = true; showToast("PDF viewer not loaded — check connection"); return Promise.resolve(); }
  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  /* pdf.js takes ownership of the buffer, so hand it a copy */
  return lib.getDocument({ data: buf.slice(0) }).promise.then(doc => {
    planDoc = doc;
    planPage = 1;
    planEls.title.textContent = name || "Site plan";
    planEls.empty.hidden = true;
    planEls.pages.hidden = doc.numPages < 2;
    return drawPlanPage();
  }).catch(err => {
    console.warn(err);
    planEls.loading.hidden = true;
    showToast("Could not open that PDF");
  });
}

function gotoPlanPage(n){
  if(!planDoc) return;
  if(n < 1 || n > planDoc.numPages) return;
  planPage = n;
  drawPlanPage();
}

/* Render at a generous resolution so plot numbers stay readable when zoomed */
function drawPlanPage(){
  planEls.loading.hidden = false;
  return planDoc.getPage(planPage).then(page => {
    const stageW = planEls.stage.clientWidth || 360;
    const stageH = planEls.stage.clientHeight || 600;
    const base = page.getViewport({ scale: 1 });
    const fit = Math.min(stageW / base.width, stageH / base.height);
    const render = Math.min(fit * 4, 6);           /* cap so huge drawings stay in memory */
    const vp = page.getViewport({ scale: render });
    const canvas = planEls.canvas;
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    canvas.style.width = canvas.width + "px";
    canvas.style.height = canvas.height + "px";
    return page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise.then(() => {
      planFitScale = fit / render;                 /* CSS scale that fits the screen */
      planScale = planFitScale;
      centrePlan();
      applyPlanTransform();
      planEls.loading.hidden = true;
      planEls.pageno.textContent = planPage + "/" + planDoc.numPages;
    });
  });
}

function centrePlan(){
  const c = planEls.canvas;
  planTx = (planEls.stage.clientWidth  - c.width  * planScale) / 2;
  planTy = (planEls.stage.clientHeight - c.height * planScale) / 2;
  if(planTy < 0) planTy = 0;
}
function applyPlanTransform(){
  planEls.wrap.style.transform = "translate(" + planTx + "px," + planTy + "px) scale(" + planScale + ")";
}
function zoomPlan(factor, cx, cy){
  if(!planDoc) return;
  const sx = cx == null ? planEls.stage.clientWidth / 2 : cx;
  const sy = cy == null ? planEls.stage.clientHeight / 2 : cy;
  const next = Math.max(planFitScale * 0.6, Math.min(planScale * factor, planFitScale * 14));
  const k = next / planScale;
  planTx = sx - (sx - planTx) * k;
  planTy = sy - (sy - planTy) * k;
  planScale = next;
  applyPlanTransform();
}

/* One finger pans, two fingers pinch-zoom, double-tap toggles fit/close-up */
function attachPlanGestures(){
  const stage = planEls.stage;
  const pts = new Map();
  let last = null, lastTap = 0;

  stage.addEventListener("pointerdown", e => {
    if(!planDoc) return;
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    last = null;
    if(pts.size === 1){
      const now = Date.now();
      if(now - lastTap < 300){
        zoomPlan(planScale > planFitScale * 1.5 ? planFitScale / planScale : 2.5, e.clientX, e.clientY);
      }
      lastTap = now;
    }
  });

  stage.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(pts.size === 1){
      planTx += e.clientX - prev.x;
      planTy += e.clientY - prev.y;
      applyPlanTransform();
    } else if(pts.size === 2){
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if(last){
        if(last.dist > 0) zoomPlan(dist / last.dist, mid.x, mid.y);
        planTx += mid.x - last.mid.x;
        planTy += mid.y - last.mid.y;
        applyPlanTransform();
      }
      last = { dist, mid };
    }
  });

  const up = e => {
    pts.delete(e.pointerId);
    if(pts.size < 2) last = null;
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
}

/* ============================================================
   Toast
   ============================================================ */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
