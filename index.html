}

function renderPlot(stage, plot){
  const el = document.createElement("div");
  el.className = "plot" + (plot.open ? " open" : "");
  const { done, total } = plotCounts(plot);

  const si = state.indexOf(stage);
  const nextStage = nextFlowStage(stage);            /* basic headers are skipped, and have no swipe */

  const swipe = document.createElement("div");
  swipe.className = "plot-swipe";

  if(nextStage){
    const action = document.createElement("div");
    action.className = "plot-swipe-action";
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = nextStage.name;
    action.appendChild(lbl);
    action.insertAdjacentHTML("beforeend", ICON.arrow);
    swipe.appendChild(action);
  }

  const head = document.createElement("div");
  head.className = "plot-head";
  head.innerHTML = ICON.chev;

  const nameInput = document.createElement("input");
  nameInput.className = "plot-name";
  nameInput.value = plot.name;
  nameInput.setAttribute("aria-label","Plot name");
  nameInput.onclick = e => e.stopPropagation();
  nameInput.oninput = () => { plot.name = nameInput.value; save(); };

  const frac = document.createElement("span");
  frac.className = "frac" + (total>0 && done===total ? " done" : "");
  frac.textContent = done + "/" + total;

  head.appendChild(nameInput);
  head.appendChild(frac);
  const chips = progChips(plot, stage);                 /* ahead + claim chips on their own line */
  if(chips.length){
    const cw = document.createElement("div");
    cw.className = "plot-chips";
    chips.forEach(c => cw.appendChild(c));
    head.appendChild(cw);
  }
  head.onclick = () => {
    if(head.__swiped) return;              /* was a horizontal swipe — ignore the tap */
    plot.open = !plot.open; save(); el.classList.toggle("open", plot.open);
  };
  swipe.appendChild(head);
  el.appendChild(swipe);

  if(nextStage) attachSwipe(head, stage, plot);

  const body = document.createElement("div");
  body.className = "plot-body";
  plot.tasks.forEach((task, i) => {
    body.appendChild(renderTask(stage, plot, task));
    /* time bar between two consecutive completed phases */
    const next = plot.tasks[i + 1];
    if(task.done && next && next.done && typeof task.doneAt === "number" && typeof next.doneAt === "number"){
      const gap = next.doneAt - task.doneAt;
      if(gap > 0) body.appendChild(timeBar(fmtDur(gap)));
    }
  });

  const addTask = document.createElement("button");
  addTask.className = "add-btn add-task-btn";
  addTask.innerHTML = ICON.plus + " Add task";
  addTask.onclick = () => {
    plot.tasks.push({ id: uid(), name: "", done:false, doneAt:null, due:null, note:"", noteOpen:true });
    save(); render();
  };
  body.appendChild(addTask);

  const delRow = document.createElement("div");
  delRow.className = "plot-del-row";
  const delPlot = document.createElement("button");
  delPlot.className = "del-plot";
  delPlot.innerHTML = ICON.trash + " Delete plot";
  delPlot.onclick = () => {
    if(confirm('Delete "'+plot.name+'"?')){
      stage.plots = stage.plots.filter(p => p.id !== plot.id);
      save(); render();
    }
  };
  delRow.appendChild(delPlot);
  body.appendChild(delRow);

  el.appendChild(body);
  return el;
}

/* Swipe a plot row left to advance it to the next stage */
function attachSwipe(head, stage, plot){
  const MAX = 150, TRIG = 72;
  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horiz = false;

  const settle = () => {
    head.style.transition = "transform .2s ease";
    head.style.transform = "translateX(0)";
  };

  head.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    dx = 0; dragging = true; decided = false; horiz = false;
    head.style.transition = "none";
  });

  head.addEventListener("pointermove", e => {
    if(!dragging) return;
    const mx = e.clientX - startX, my = e.clientY - startY;
    if(!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)){
      decided = true;
      horiz = Math.abs(mx) > Math.abs(my);
      if(horiz){ try{ head.setPointerCapture(e.pointerId); }catch(_){ } }
    }
    if(decided && horiz){
      dx = Math.max(-MAX, Math.min(0, mx));   /* left only */
      head.style.transform = "translateX(" + dx + "px)";
      if(Math.abs(dx) > 6) head.__swiped = true;
    }
  });

  const end = () => {
    if(!dragging) return;
    dragging = false;
    const trigger = decided && horiz && dx <= -TRIG;
    settle();
    if(trigger) setTimeout(() => movePlotToNextStage(stage, plot), 80);
    setTimeout(() => { head.__swiped = false; }, 60);
  };
  head.addEventListener("pointerup", end);
  head.addEventListener("pointercancel", end);
}

/* The next stage in the build flow, skipping basic headers (e.g. Brickwork).
   Plots inside a basic header have no next stage — they are managed manually. */
function nextFlowStage(stage){
  const si = state.indexOf(stage);
  if(si < 0 || stage.basic) return null;
  for(let i = si + 1; i < state.length; i++){
    if(!state[i].basic) return state[i];
  }
  return null;
}

function movePlotToNextStage(stage, plot){
  const next = nextFlowStage(stage);
  if(!next){ showToast('"' + plot.name + '" is at the final stage'); return; }
  const c = plotCounts(plot);
  if(!confirm('Move "' + plot.name + '" (' + c.done + '/' + c.total + ' done) to "' + next.name + '"?')) return;

  /* remove from current stage */
  stage.plots = stage.plots.filter(p => p.id !== plot.id);

  /* merge on matching name so we never create a duplicate plot in the next stage */
  const existing = next.plots.find(p => p.name.trim().toLowerCase() === plot.name.trim().toLowerCase());
  if(!existing){
    /* new to this stage — give it this stage's preset checklist (fresh/unticked) */
    next.plots.push({ id: uid(), name: plot.name, open: false, prog: plot.prog || null, tasks: tasksFromStage(next) });
  } else if(!existing.prog && plot.prog){
    existing.prog = plot.prog;
  }

  next.open = true;          /* reveal the destination so the move is visible */
  save(); render();
  showToast('"' + plot.name + '" moved to ' + next.name);
}

function renderTask(stage, plot, task){
  const el = document.createElement("div");
  el.className = "task" + (task.done ? " checked" : "");

  /* tick */
  const tick = document.createElement("div");
  tick.className = "tick" + (task.done ? " on" : "");
  tick.innerHTML = ICON.check;
  tick.setAttribute("role","checkbox");
  tick.setAttribute("aria-checked", task.done ? "true" : "false");
  tick.onclick = () => {
    task.done = !task.done;
    if(task.done){
      task.doneAt = nowMs();
      logEvent(plot.name, stage.name, task.name, task.doneAt);
      if(isCML(task.name)){
        completePlot(stage, plot);
        saveNow(); render();
        showToast('"' + plot.name + '" complete → Completed Plots');
        return;
      }
    } else {
      unlogEvent(plot.name, stage.name, task.name);
      task.doneAt = null;
    }
    saveNow(); render();
  };

  /* main */
  const main = document.createElement("div");
  main.className = "task-main";
  const nameInput = document.createElement("input");
  nameInput.className = "task-name";
  nameInput.value = task.name;
  nameInput.placeholder = "Task name";
  nameInput.setAttribute("aria-label","Task name");
  nameInput.oninput = () => { task.name = nameInput.value; save(); };
  main.appendChild(nameInput);

  /* due-date chip (only shown once a date has been set) */
  const dueWrap = document.createElement("div");
  main.appendChild(dueWrap);

  const noteArea = document.createElement("div");
  noteArea.className = "note-area" + (task.noteOpen ? " show" : "");
  const ta = document.createElement("textarea");
  ta.value = task.note;
  ta.placeholder = "Add a note…";
  ta.setAttribute("aria-label","Task note");
  ta.oninput = () => { task.note = ta.value; save(); updateNoteBtn(); };
  noteArea.appendChild(ta);
  main.appendChild(noteArea);

  /* actions */
  const actions = document.createElement("div");
  actions.className = "task-actions";

  const noteBtn = document.createElement("button");
  noteBtn.innerHTML = ICON.note;
  noteBtn.setAttribute("aria-label","Toggle note");
  function updateNoteBtn(){
    const hasNote = task.note.trim().length > 0;
    noteBtn.className = "icon-btn" + (hasNote ? " note-on" : "");
  }
  updateNoteBtn();
  noteBtn.onclick = () => {
    task.noteOpen = !task.noteOpen;
    save();
    noteArea.classList.toggle("show", task.noteOpen);
    if(task.noteOpen) ta.focus();
  };

  /* due date — a native date picker hidden over a calendar button */
  const dueBtn = document.createElement("label");
  dueBtn.innerHTML = ICON.cal;
  dueBtn.setAttribute("aria-label","Set date trade will finish");
  const dueInput = document.createElement("input");
  dueInput.type = "date";
  dueInput.value = task.due || "";
  dueInput.setAttribute("aria-label","Finish date");
  dueInput.onchange = () => {
    task.due = dueInput.value || null;
    saveNow(); render();
  };
  dueBtn.appendChild(dueInput);

  function paintDue(){
    const st = dueState(task);
    dueBtn.className = "icon-btn due-btn" + (st === "over" ? " due-over" : st === "today" ? " due-today" : st ? " due-set" : "");
    dueWrap.innerHTML = "";
    if(task.due) dueWrap.appendChild(dueChip(task));
  }
  paintDue();

  const delBtn = document.createElement("button");
  delBtn.className = "icon-btn del";
  delBtn.innerHTML = ICON.trash;
  delBtn.setAttribute("aria-label","Delete task");
  delBtn.onclick = () => {
    plot.tasks = plot.tasks.filter(t => t.id !== task.id);
    save(); render();
  };

  actions.appendChild(noteBtn);
  actions.appendChild(dueBtn);
  actions.appendChild(delBtn);

  el.appendChild(tick);
  el.appendChild(main);
  el.appendChild(actions);
  return el;
}

/* ============================================================
   PDF export
   ============================================================ */
function exportPDF(){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ showToast("PDF library not loaded — check connection"); return; }

  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 40;
  const marginBottom = 46;
  let y = 52;

  const today = new Date();
  const dateStr = today.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
  const fileDate = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
  const { done, total } = overallCounts();
  const overallP = pct(done, total);

  function newPageIfNeeded(need){
    if(y + need > pageH - marginBottom){ doc.addPage(); y = 52; }
  }

  /* Title */
  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.setTextColor(30,58,58);
  doc.text("Site Progress", marginX, y);
  y += 22;

  doc.setFont("helvetica","normal");
  doc.setFontSize(11);
  doc.setTextColor(91,115,115);
  doc.text(dateStr, marginX, y);
  doc.text("Overall: " + overallP + "%  (" + done + "/" + total + " tasks)", pageW - marginX, y, { align:"right" });
  y += 12;
  doc.setDrawColor(220,237,232);
  doc.setLineWidth(1);
  doc.line(marginX, y, pageW - marginX, y);
  y += 22;

  state.forEach((stage, si) => {
    /* only plots with at least one ticked task make the report — except the
       last three flow stages (2nd Fix, Paint & Decoration, Finals), which
       always show every plot */
    const showAll = !stage.basic && stage.progNo >= 7 && stage.progNo <= 9;
    const active = showAll ? stage.plots.slice() : stage.plots.filter(p => plotCounts(p).done > 0);
    if(!active.length) return;

    const sc = stageCounts(stage);
    const sp = pct(sc.done, sc.total);

    newPageIfNeeded(30);
    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.setTextColor(58,168,188);
    doc.text(stage.name || "Stage", marginX, y);
    doc.setFont("helvetica","normal");
    doc.setFontSize(10);
    doc.setTextColor(91,115,115);
    doc.text(sp + "%  (" + sc.done + "/" + sc.total + ")", pageW - marginX, y, { align:"right" });
    y += 16;

    active.forEach(plot => {
      const pc = plotCounts(plot);
      newPageIfNeeded(30);
      doc.setFont("helvetica","bold");
      doc.setFontSize(11.5);
      doc.setTextColor(30,58,58);
      doc.text(plot.name || "Plot", marginX + 12, y);
      doc.setFont("helvetica","normal");
      doc.setFontSize(9.5);
      doc.setTextColor(120,140,140);
      doc.text(pc.done + "/" + pc.total, pageW - marginX, y, { align:"right" });

      /* programme status: days ahead + claim-by date for this stage (never for basic headers) */
      if(plot.prog && !stage.basic && stage.progNo){
        const bits = [];
        const ahead = daysAhead(plot, stage);
        if(ahead > 0) bits.push({ t: ahead + "d ahead of programme", c: [51,168,125] });
        const due = plot.prog.est && plot.prog.est[String(stage.progNo)];
        if(due){
          const ci = claimInfo(due);
          bits.push({
            t: ci.st === "over" ? "claim S" + stage.progNo + " was due " + fmtDay(ci.claim) + " (" + (-ci.days) + "d over)"
                                : "claim S" + stage.progNo + " by " + fmtDay(ci.claim) + (ci.st === "today" ? " (today)" : " (" + ci.days + "d)"),
            c: ci.st === "over" ? [194,83,83] : ci.st === "near" || ci.st === "today" ? [169,118,26] : [58,168,188]
          });
        }
        if(bits.length){
          y += 12;
          doc.setFontSize(9);
          let bx = marginX + 12;
          bits.forEach((b, bi) => {
            doc.setTextColor(b.c[0], b.c[1], b.c[2]);
            const txt = (bi ? "  ·  " : "") + b.t;
            doc.text(txt, bx, y);
            bx += doc.getTextWidth(txt);
          });
        }
      }
      y += 15;

      plot.tasks.forEach(task => {
        newPageIfNeeded(16);
        const box = task.done ? "[x]" : "[ ]";
        doc.setFont("courier","normal");
        doc.setFontSize(10.5);
        doc.setTextColor(task.done ? 51 : 120, task.done ? 168 : 140, task.done ? 125 : 140);
        doc.text(box, marginX + 26, y);

        doc.setFont("helvetica","normal");
        doc.setFontSize(11);
        doc.setTextColor(30,58,58);
        const nameX = marginX + 52;
        const nameLines = doc.splitTextToSize(task.name || "(unnamed task)", pageW - marginX - nameX);
        doc.text(nameLines, nameX, y);
        y += 14 * nameLines.length;

        if(task.due){
          newPageIfNeeded(13);
          const st = dueState(task);
          doc.setFont("helvetica","normal");
          doc.setFontSize(9.5);
          if(st === "over" || st === "late") doc.setTextColor(194,83,83);
          else if(st === "today") doc.setTextColor(169,118,26);
          else if(st === "met") doc.setTextColor(51,168,125);
          else doc.setTextColor(58,168,188);
          doc.text("Due " + fmtDay(task.due) + "  (" + dueLabel(task) + ")", nameX + 12, y);
          y += 12.5;
        }

        const note = (task.note || "").trim();
        if(note){
          doc.setFont("helvetica","italic");
          doc.setFontSize(9.5);
          doc.setTextColor(120,140,140);
          const noteLines = doc.splitTextToSize("Note: " + note, pageW - marginX - (nameX + 12));
          noteLines.forEach(line => {
            newPageIfNeeded(13);
            doc.text(line, nameX + 12, y);
            y += 12.5;
          });
          y += 2;
        }
      });
      y += 6;
    });
    y += 10;
  });

  doc.save("Site-Progress-" + fileDate + ".pdf");
  showToast("PDF exported");
}

/* ============================================================
   Site layout plan — a PDF kept on this device (IndexedDB, so a
   multi-megabyte drawing is fine) and rendered with PDF.js
   ============================================================ */
const DB_NAME = "siteProgressFiles", DB_STORE = "files", PLAN_KEY = "siteplan";

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbTx(mode, fn){
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, mode);
    const rq = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}
const planSave = rec => idbTx("readwrite", s => s.put(rec, PLAN_KEY));
const planLoad = ()  => idbTx("readonly",  s => s.get(PLAN_KEY));
const planDrop = ()  => idbTx("readwrite", s => s.delete(PLAN_KEY));

const planEls = {};
let planDoc = null, planPage = 1;
/* Current view: scale = PDF units -> CSS px, tx/ty = page origin on screen */
let planScale = 1, planFitScale = 1, planTx = 0, planTy = 0;
/* What the canvas bitmap currently holds, so it can be transformed until the next sharp render */
let rScale = 1, rTx = 0, rTy = 0, rMx = 0, rMy = 0;
let planPageObj = null, planBase = null, planRenderTask = null, planRerenderTimer = null;
const PLAN_MARGIN = 1.5;      /* render half a screen beyond the edges so small pans stay covered */
const PLAN_PIXEL_BUDGET = 8e6;

function planBind(){
  ["overlay","close","title","pages","prev","next","pageno","replace","stage","wrap","canvas","empty","loading","attach","file","out","fit","in"]
    .forEach(k => planEls[k] = document.getElementById("plan-" + k));

  planEls.overlay && (planEls.close.onclick = closePlan);
  document.getElementById("plan-btn").onclick = openPlan;
  planEls.attach.onclick = () => planEls.file.click();
  planEls.file.onchange = onPlanFile;
  planEls.replace.onclick = planMenu;
  planEls.prev.onclick = () => gotoPlanPage(planPage - 1);
  planEls.next.onclick = () => gotoPlanPage(planPage + 1);
  planEls.in.onclick  = () => zoomPlan(1.4);
  planEls.out.onclick = () => zoomPlan(1 / 1.4);
  planEls.fit.onclick = () => { planScale = planFitScale; centrePlan(); applyPlanTransform(); };
  attachPlanGestures();
}

function openPlan(){
  planEls.overlay.hidden = false;
  document.body.style.overflow = "hidden";
  if(!planDoc) loadPlanFromStore();
}
function closePlan(){
  planEls.overlay.hidden = true;
  document.body.style.overflow = "";
}

function planMenu(){
  if(!planDoc){ planEls.file.click(); return; }
  if(confirm("Replace the site plan with a different PDF?\n\nTap Cancel to keep it, then use Remove below if you want it gone.")){
    planEls.file.click();
  } else if(confirm("Remove the current site plan?")){
    planDrop().then(() => { planDoc = null; showPlanEmpty(); showToast("Site plan removed"); });
  }
}

function onPlanFile(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  if(!/pdf/i.test(f.type) && !/\.pdf$/i.test(f.name)){ showToast("Please choose a PDF"); return; }
  planEls.empty.hidden = true;
  planEls.loading.hidden = false;
  f.arrayBuffer()
    .then(buf => planSave({ name: f.name, buf }).then(() => renderPlanFrom(buf, f.name)))
    .then(() => showToast("Site plan saved to this phone"))
    .catch(err => { console.warn(err); planEls.loading.hidden = true; showToast("Could not save that PDF"); });
}

let planLoadSeq = 0;
function loadPlanFromStore(){
  const seq = ++planLoadSeq;
  planEls.loading.hidden = false;
  planEls.empty.hidden = true;
  planLoad()
    .then(rec => {
      if(seq !== planLoadSeq) return;          /* a newer attach/render won the race */
      if(!rec || !rec.buf){ showPlanEmpty(); return; }
      return renderPlanFrom(rec.buf, rec.name);
    })
    .catch(err => { if(seq === planLoadSeq){ console.warn(err); showPlanEmpty(); } });
}

function showPlanEmpty(){
  planEls.loading.hidden = true;
  planEls.empty.hidden = false;
  planEls.pages.hidden = true;
  planEls.title.textContent = "Site plan";
  planEls.canvas.width = planEls.canvas.height = 0;
}

function renderPlanFrom(buf, name){
  planLoadSeq++;                                /* this render supersedes any in-flight store load */
  const lib = window.pdfjsLib;
  if(!lib){ planEls.loading.hidden = true; showToast("PDF viewer not loaded — check connection"); return Promise.resolve(); }
  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  /* pdf.js takes ownership of the buffer, so hand it a copy */
  return lib.getDocument({ data: buf.slice(0) }).promise.then(doc => {
    planDoc = doc;
    planPage = 1;
    planEls.title.textContent = name || "Site plan";
    planEls.empty.hidden = true;
    planEls.pages.hidden = doc.numPages < 2;
    return drawPlanPage();
  }).catch(err => {
    console.warn(err);
    planEls.loading.hidden = true;
    showToast("Could not open that PDF");
  });
}

function gotoPlanPage(n){
  if(!planDoc) return;
  if(n < 1 || n > planDoc.numPages) return;
  planPage = n;
  drawPlanPage();
}

function drawPlanPage(){
  planEls.loading.hidden = false;
  return planDoc.getPage(planPage).then(page => {
    planPageObj = page;
    planBase = page.getViewport({ scale: 1 });
    const sw = planEls.stage.clientWidth || 360;
    const sh = planEls.stage.clientHeight || 600;
    planFitScale = Math.min(sw / planBase.width, sh / planBase.height);
    planScale = planFitScale;
    centrePlan();
    return rerenderPlan();
  });
}

function centrePlan(){
  planTx = (planEls.stage.clientWidth  - planBase.width  * planScale) / 2;
  planTy = (planEls.stage.clientHeight - planBase.height * planScale) / 2;
  if(planTy < 0) planTy = 0;
}

/* The bitmap on screen was rendered for (rScale, rTx, rTy). Until the next sharp
   render lands, stretch/shift it to match the live view so gestures stay smooth. */
function applyPlanTransform(){
  const k = planScale / rScale;
  const x = planTx - (rTx + rMx) * k;
  const y = planTy - (rTy + rMy) * k;
  planEls.wrap.style.transform = "translate(" + x + "px," + y + "px) scale(" + k + ")";
}

function scheduleRerender(){
  clearTimeout(planRerenderTimer);
  planRerenderTimer = setTimeout(rerenderPlan, 150);
}

/* Re-rasterise ONLY the region on screen, at the current zoom × screen pixel density.
   Keeps the drawing genuinely sharp at any zoom without a huge canvas. */
function rerenderPlan(){
  if(!planPageObj || !planEls.stage.clientWidth) return Promise.resolve();
  if(planRenderTask){ try{ planRenderTask.cancel(); }catch(e){} planRenderTask = null; }

  const sw = planEls.stage.clientWidth, sh = planEls.stage.clientHeight;
  const mx = sw * (PLAN_MARGIN - 1) / 2, my = sh * (PLAN_MARGIN - 1) / 2;
  const cssW = sw + mx * 2, cssH = sh + my * 2;

  let dpr = Math.min(window.devicePixelRatio || 1, 3);
  if(cssW * dpr * cssH * dpr > PLAN_PIXEL_BUDGET){
    dpr *= Math.sqrt(PLAN_PIXEL_BUDGET / (cssW * dpr * cssH * dpr));
  }
  const cw = Math.max(1, Math.round(cssW * dpr)), ch = Math.max(1, Math.round(cssH * dpr));

  /* snapshot the view this render is for */
  const sScale = planScale, sTx = planTx, sTy = planTy;
  const Sd = sScale * dpr;
  const e = (sTx + mx) * dpr, f = (sTy + my) * dpr;

  /* draw offscreen, then swap in one go so there is no blank flash */
  const off = document.createElement("canvas");
  off.width = cw; off.height = ch;
  const ctx = off.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(e, f, planBase.width * Sd, planBase.height * Sd);

  const task = planPageObj.render({
    canvasContext: ctx,
    viewport: planPageObj.getViewport({ scale: Sd }),
    transform: [1, 0, 0, 1, e, f]
  });
  planRenderTask = task;

  return task.promise.then(() => {
    planRenderTask = null;
    const canvas = planEls.canvas;
    canvas.width = cw; canvas.height = ch;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.getContext("2d").drawImage(off, 0, 0);
    rScale = sScale; rTx = sTx; rTy = sTy; rMx = mx; rMy = my;
    applyPlanTransform();
    planEls.loading.hidden = true;
    if(planDoc) planEls.pageno.textContent = planPage + "/" + planDoc.numPages;
  }).catch(err => {
    if(err && (err.name === "RenderingCancelledException" || /cancel/i.test(err.message || ""))) return;
    console.warn(err);
    planEls.loading.hidden = true;
  });
}

function zoomPlan(factor, cx, cy){
  if(!planDoc) return;
  const sx = cx == null ? planEls.stage.clientWidth / 2 : cx;
  const sy = cy == null ? planEls.stage.clientHeight / 2 : cy;
  const next = Math.max(planFitScale * 0.6, Math.min(planScale * factor, planFitScale * 30));
  const k = next / planScale;
  planTx = sx - (sx - planTx) * k;
  planTy = sy - (sy - planTy) * k;
  planScale = next;
  applyPlanTransform();
  scheduleRerender();
}

/* One finger pans, two fingers pinch-zoom, double-tap toggles fit/close-up */
function attachPlanGestures(){
  const stage = planEls.stage;
  const pts = new Map();
  let last = null, lastTap = 0;

  stage.addEventListener("pointerdown", e => {
    if(!planDoc) return;
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    last = null;
    if(pts.size === 1){
      const now = Date.now();
      if(now - lastTap < 300){
        zoomPlan(planScale > planFitScale * 1.5 ? planFitScale / planScale : 2.5, e.clientX, e.clientY);
      }
      lastTap = now;
    }
  });

  stage.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(pts.size === 1){
      planTx += e.clientX - prev.x;
      planTy += e.clientY - prev.y;
      applyPlanTransform();
    } else if(pts.size === 2){
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if(last){
        if(last.dist > 0) zoomPlan(dist / last.dist, mid.x, mid.y);
        planTx += mid.x - last.mid.x;
        planTy += mid.y - last.mid.y;
        applyPlanTransform();
      }
      last = { dist, mid };
    }
  });

  const up = e => {
    pts.delete(e.pointerId);
    if(pts.size < 2) last = null;
    if(pts.size === 0 && planDoc) scheduleRerender();   /* sharpen once the gesture ends */
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);

  /* rotate the phone / resize: refit and redraw */
  window.addEventListener("resize", () => {
    if(planEls.overlay.hidden || !planPageObj) return;
    clearTimeout(planRerenderTimer);
    planRerenderTimer = setTimeout(() => {
      const sw = planEls.stage.clientWidth, sh = planEls.stage.clientHeight;
      planFitScale = Math.min(sw / planBase.width, sh / planBase.height);
      rerenderPlan();
    }, 200);
  });
}

/* ============================================================
   Toast
   ============================================================ */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ============================================================
   Boot
   ============================================================ */
document.getElementById("export-btn").addEventListener("click", exportPDF);

/* Persist just before the app is backgrounded/closed (belt & braces on top of debounced save) */
window.addEventListener("pagehide", saveNow);

/* ============================================================
   Backup / restore — move the whole app's data between phones
   (everything lives on-device; the site plan PDF is re-attached
   separately since it is stored in file storage)
   ============================================================ */
function backupData(){
  return { kind: "site-progress-backup", version: 2, at: Date.now(),
           state: state, timeline: timeline, completed: completed, programData: programData };
}
function exportBackup(){
  saveNow();
  const d = new Date();
  const name = "Site-Progress-Backup-" + d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
  const json = JSON.stringify(backupData());
  try{
    const file = new File([json], name, { type: "application/json" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: "Site Progress backup" }).catch(() => {});
      return;
    }
  }catch(e){}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  showToast("Backup saved");
}
function importBackup(f){
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if(!d || d.kind !== "site-progress-backup" || !Array.isArray(d.state)) throw new Error("bad backup");
    if(!confirm("Restore backup from " + fmtDate(d.at) + "?\n\nThis REPLACES everything currently in this app on this phone.")) return;
    state = migrate(normalize(d.state));
    timeline = d.timeline || {};
    completed = Array.isArray(d.completed) ? d.completed : [];
    programData = d.programData || null;
    saveNow(); render();
    showToast("Backup restored");
  }).catch(err => { console.warn(err); showToast("That's not a Site Progress backup file"); });
}

/* ---- self-update: fetch a fresh copy of this page and reload if the build is newer ---- */
function checkForUpdate(){
  try{
    if(location.protocol === "file:") return;
    fetch(location.href, { cache: "reload" })
      .then(r => (r && r.ok) ? r.text() : null)
      .then(html => {
        if(!html) return;
        const m = html.match(/const BUILD = "build (\d+)/);
        const cur = parseInt((BUILD.match(/build (\d+)/) || [0, 0])[1], 10);
        if(!m || parseInt(m[1], 10) <= cur) return;
        try{                                        /* avoid reload loops if an edge cache lags */
          if(sessionStorage.getItem("siteProgress.updSeen") === m[1]) return;
          sessionStorage.setItem("siteProgress.updSeen", m[1]);
        }catch(e){}
        saveNow();
        showToast("Updating to build " + m[1] + "…");
        setTimeout(() => location.reload(), 900);
      })
      .catch(() => {});
  }catch(e){}
}
let lastUpdCheck = Date.now();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && Date.now() - lastUpdCheck > 600000){
    lastUpdCheck = Date.now();
    checkForUpdate();
  }
});

planBind();
bindProgram();
document.getElementById("backup-btn").onclick = exportBackup;
document.getElementById("restore-file").onchange = e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(f) importBackup(f);
};
render();
checkForUpdate();
</script>
